name: Auto-fix Casks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Casks/**/*.rb"

permissions:
  contents: write

concurrency:
  group: autofix-casks-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master
        with:
          stable: true

      - name: Cache Homebrew gems
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew gems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - name: Detect changed casks
        id: casks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1

          mapfile -t files < <(
            git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
              | grep -E '^Casks/.*\.rb$' || true
          )

          if (( ${#files[@]} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf "%s\n" "${files[@]}" > casks_changed.txt
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Auto-fix style (brew style --fix)
        if: steps.casks.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < casks_changed.txt
          brew style --fix "${files[@]}"

      - name: Commit and push auto-fixes (same-repo PRs only)
        if: steps.casks.outputs.found == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t files < casks_changed.txt
          git add "${files[@]}"
          git commit -m "style(cask): auto-fix (brew style --fix)"

          # Make HTTPS pushes non-interactive + authenticated
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

